name: release
# Publishes to npm when a version tag is pushed, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# Needs the repository secret NPM_TOKEN: an npm granular access token that may publish @lolipopshock/pi-clm.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tag must match package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Publish
        # Provenance can only be generated from a public repository.
        run: npm publish --access public ${{ !github.event.repository.private && '--provenance' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
